---
podlivkin_hosts:
  hosts:
    gost_proxy_server:
      ## Параметры доступа к машине, на которой запущен
      ## контейнер с прокси-сервером.
      ansible_host: 10.0.1.10
      ansible_user: automation
      ansible_ssh_pass: !vault |
        $ANSIBLE_VAULT;1.1;AES256
        <зашифрованные данные>
      ansible_sudo_pass: !vault |
        $ANSIBLE_VAULT;1.1;AES256
        <зашифрованные данные>

    appliance_01:
      ansible_host: 10.0.3.12
      ansible_user: deploy
      ansible_ssh_pass: !vault |
        $ANSIBLE_VAULT;1.1;AES256
        <зашифрованные данные>
      ansible_sudo_pass: !vault |
        $ANSIBLE_VAULT;1.1;AES256
        <зашифрованные данные>
      vm_deploy_sphere_template: "Template_Debian_11"
      vm_deploy_sphere_name: "appliance_01_podlivkin"
      target_vm_id: 502
      target_vm_usb_port: "host=1-7,usb3=0"

    portable_unit_01:
      ansible_host: 10.0.3.22
      ansible_user: deploy
      ansible_ssh_pass: !vault |
        $ANSIBLE_VAULT;1.1;AES256
        <зашифрованные данные>
      ansible_sudo_pass: !vault |
        $ANSIBLE_VAULT;1.1;AES256
        <зашифрованные данные>
      service_ip: 10.0.2.32
      target_prefix: podlivkin
      target_vm_id: 1002

    workstation_01:
      ansible_host: 10.0.3.52
      ansible_user: deploy
      ansible_ssh_pass: !vault |
        $ANSIBLE_VAULT;1.1;AES256
        <зашифрованные данные>
      ansible_sudo_pass: !vault |
        $ANSIBLE_VAULT;1.1;AES256
        <зашифрованные данные>
      target_vm_id: 1102
      target_prefix: podlivkin
      vector_service_config: workstation_a

    workstation_02:
      ansible_host: 10.0.3.62
      ansible_user: deploy
      ansible_ssh_pass: !vault |
        $ANSIBLE_VAULT;1.1;AES256
        <зашифрованные данные>
      ansible_sudo_pass: !vault |
        $ANSIBLE_VAULT;1.1;AES256
        <зашифрованные данные>
      target_vm_id: 1202
      target_prefix: podlivkin
      vector_service_config: workstation_b

  vars:
    identify: podlivkin

    service_proxy_admin_port: 2000000

    hsm_proxy_sec_port: 2000001
    hsm_proxy_operator_port: 2000002

    tls_gateway_resourse_port: 2000003

    ansible_become_method: sudo

    sphere:
      folder: "/DC1/vm/Projects/demo/podlivkin_project"

    mail_address: "Podlivkin@example.internal"
